name: mypet
description: "말은 못 하는데 나를 아는 것 같은 AI 반려동물"
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.35.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2
  http: ^1.6.0
  speech_to_text: ^7.4.0
  flutter_secure_storage: ^11.2.0
  image: ^4.10.1
  pedometer: ^4.2.0
  permission_handler: 12.0.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  audioplayers: ^6.7.1
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
    - assets/brain/
    - assets/ui/
    - assets/items/
    - assets/sfx/
    - assets/art/
    - assets/fonts/OFL-jua.txt
    - assets/fonts/OFL-gowundodum.txt
    - assets/fonts/OFL-gaegu.txt
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
    - family: Gaegu
      fonts:
        - asset: assets/fonts/Gaegu-Regular.ttf
        - asset: assets/fonts/Gaegu-Bold.ttf
          weight: 700
