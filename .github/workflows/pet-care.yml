name: Pet care scenarios

on: workflow_dispatch

permissions:
  contents: read

jobs:
  care:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Check out the app and synthetic scenarios
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pubspec.yaml
            /pubspec.lock
            /analysis_options.yaml
            /lib/
            /assets/
            /test/
            /tools/persona_sim/
            /tools/scene_preview/

      - name: Set up the project's Flutter SDK
        run: |
          git clone --quiet --depth 1 --branch 3.38.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 3b62efc2a3da49882f43c372e0bc53daef7295a6
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting and static analysis
        run: |
          dart format --output=none --set-exit-if-changed lib test tools
          flutter analyze --no-pub

      - name: Check the practice clock and first reunion
        timeout-minutes: 5
        run: >
          flutter test --no-pub --reporter expanded --concurrency=1
          test/test_mode_test.dart test/test_mode_flow_test.dart test/first_day_recognition_test.dart

      - name: Replay two weeks across household routines and pet temperaments
        run: flutter test --no-pub --reporter expanded tools/persona_sim/persona_sim_test.dart

      - name: Publish synthetic play observations in the run summary
        run: cat build/persona_sim/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run all app tests
        run: flutter test --no-pub --reporter expanded --concurrency=2
